<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Drop shadow for depth -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Group centered with shadow -->
  <g transform="translate(16,17)" filter="url(#dropShadow)">
    
    <!-- 1. Orange Ear (Top) -->
    <g>
      <!-- Left side (Inner Ear / Light) -->
      <path d="M0,0 L-5,-10 L0,-16 L0,0 Z" fill="#FF9F55"/>
      <!-- Right side (Outer Ear / Shadow) -->
      <path d="M0,0 L5,-10 L0,-16 L0,0 Z" fill="#CC5500"/>
    </g>

    <!-- 2. White Ear (Right-Bottom) -->
    <g transform="rotate(120)">
      <!-- Left side (Light) -->
      <path d="M0,0 L-5,-10 L0,-16 L0,0 Z" fill="#F0F0F0"/>
      <!-- Right side (Shadow) -->
      <path d="M0,0 L5,-10 L0,-16 L0,0 Z" fill="#B0B0B0"/>
    </g>

    <!-- 3. Black Ear (Left-Bottom) -->
    <g transform="rotate(240)">
      <!-- Left side (Light) -->
      <path d="M0,0 L-5,-10 L0,-16 L0,0 Z" fill="#333333"/>
      <!-- Right side (Shadow) -->
      <path d="M0,0 L5,-10 L0,-16 L0,0 Z" fill="#000000"/>
    </g>
    
  </g>
</svg>
